<svg width="100%" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: url(#textGrad); letter-spacing: -0.5px; }
    .role-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #38bdf8; letter-spacing: 0.3px; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .tag-rect { fill: rgba(255, 255, 255, 0.05); stroke: rgba(148, 163, 184, 0.2); stroke-width: 1; rx: 6; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #cbd5e1; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="150" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Decorative Background Glows -->
  <circle cx="80" cy="20" r="90" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="780" cy="130" r="100" fill="#818cf8" opacity="0.10" filter="url(#glow)" />
  <circle cx="480" cy="10" r="70" fill="#c084fc" opacity="0.07" filter="url(#glow)" />

  <!-- Content Block -->
  <g transform="translate(40, 32)">
    <!-- Primary Heading -->
    <text x="0" y="24" class="name-title">Sayali Gayke</text>

    <!-- Subtitle -->
    <text x="0" y="52" class="role-subtitle">Software Developer  |  Open-Source Contributor  |  Problem Solver</text>

    <!-- Meta / Pill Badges -->
    <g transform="translate(0, 68)">
      <!-- Location Pill -->
      <rect x="0" y="0" width="138" height="24" class="tag-rect" />
      <circle cx="12" cy="12" r="3" fill="#38bdf8" />
      <text x="22" y="16" class="tag-text">Pune, Maharashtra</text>

      <!-- Pronouns Pill -->
      <rect x="146" y="0" width="82" height="24" class="tag-rect" />
      <text x="156" y="16" class="tag-text">She / Her</text>

      <!-- Community Pill -->
      <rect x="236" y="0" width="94" height="24" class="tag-rect" />
      <circle cx="248" cy="12" r="3" fill="#818cf8" />
      <text x="258" y="16" class="tag-text">GSSoC '26</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Bar -->
  <rect x="0" y="146" width="850" height="4" rx="2" fill="url(#accentGrad)" />
</svg>
